<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Vertical Gallery</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f6f8;
      color: #111;
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid #ddd;
      background: #fff;
      position: sticky;
      top: 0;
    }
    .gallery {
      display: flex;
      flex-wrap: nowrap;
      gap: 14px;
      overflow-x: auto;
      padding: 16px;
      align-items: flex-start;
    }
    .card {
      flex: 0 0 340px;
      background: #fff;
      border: 1px solid #d7dbe0;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .svg-wrap {
      width: 100%;
      height: 720px;
      overflow: auto;
      border: 1px solid #eef1f4;
      border-radius: 6px;
      background: #fff;
    }
    .card object {
      width: max-content;
      height: max-content;
      display: block;
    }
  </style>
</head>
<body>
  <header><strong>SVG Vertical Gallery</strong> (1 files)</header>
  <main class="gallery">
        <article class="card">
          <h2>LEG_FICTIONAL_VCUUO</h2>
          <div class="svg-wrap">
            <object type="image/svg+xml" data="LEG_FICTIONAL_VCUUO.svg" aria-label="LEG_FICTIONAL_VCUUO"></object>
          </div>
        </article></main>
</body>
</html>
